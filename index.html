<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body{margin:0;font:18px sans-serif;background:#111;color:#fff}
.row{padding:5px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{width:60px;font-size:20px}
button{font-size:18px;padding:9px 12px;border:0;border-radius:10px;background:#e5e5ea}
#go{background:#2e9d3f;color:#fff}
#fin{background:#c0392b;color:#fff}
button:disabled{opacity:.4}
#hint{padding:4px 8px;font:17px sans-serif;color:#00e5ff;display:none}
#map{width:100vw;height:40vh;background:#1b3a1b}
#steer{padding:6px;font:bold 28px sans-serif;text-align:center;background:#222}
#prog{padding:6px;font:bold 21px sans-serif;text-align:center;background:#181818;color:#00e5ff;display:none}
#info{padding:8px;font:15px monospace;white-space:pre}
</style>
<div class="row">Width <input id="w" type="number" value="1.5" step="0.1"> Overlap <input id="ov" type="number" value="0.1" step="0.05"> Tol <input id="tol" type="number" value="0.3" step="0.1"></div>
<div class="row"><button id="go">Start</button><button id="fin" disabled>Finish</button><button id="mark">Mark A</button><button id="clr">New job</button></div>
<div class="row"><button id="brect">Rectangle</button><button id="bcirc">Circle</button><button id="bclr">Clear boundary</button></div>
<div class="row"><label><input type="checkbox" id="follow" checked> Follow</label><label><input type="checkbox" id="snd" checked> Voice</label><button id="test">Test voice</button></div>
<div id="hint"></div>
<div id="map"></div>
<div id="steer">Mark A at the start of your first pass</div>
<div id="prog"></div>
<div id="info">Waiting for GPS…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const w=$('w'),ov=$('ov'),tol=$('tol'),info=$('info'),steer=$('steer'),prog=$('prog'),hint=$('hint');
const go=$('go'),fin=$('fin'),mark=$('mark'),follow=$('follow'),snd=$('snd');
const R=6371000,K=Math.PI/180,MAX_ACC=10,MIN_SPEED=0.3,CELL=0.25,DONE_FRAC=0.8;
let origin=null,cur=null,heading=null,acc=null,spd=null;
let state='idle',segs=[],seg=null,length=0,runStart=0,elapsed=0,lock=null;
let A=null,guide=null,laneIdx=null,gstage=0,herr=null;
let lastSpeak=0,lastWeak=0,wasOff=false,lastAbs=null,lastAbsT=0,converging=false;
let bound=null,boundArea=0,gridPts=[],laneData=null,lastDone=null;
let drawMode=null,drawPts=[];
const covered=new Set();

function say(t){
  if(!snd.checked||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.rate=1.05;u.volume=1;
  speechSynthesis.speak(u);
}
$('test').onclick=()=>{const was=snd.checked;snd.checked=true;say('Turn back right, point six metres');snd.checked=was};

const map=L.map('map',{zoomControl:false,maxZoom:21}).setView([0,0],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxNativeZoom:17,maxZoom:21,attribution:'Imagery © Esri'}).addTo(map);
const boundLayer=L.layerGroup().addTo(map),lanesLayer=L.layerGroup().addTo(map),
      swathLayer=L.layerGroup().addTo(map),drawLayer=L.layerGroup().addTo(map);
const me=L.circleMarker([0,0],{radius:8,color:'#000',weight:2,fillColor:'#fff',fillOpacity:1});
const head=L.polyline([],{color:'#fff',weight:3});
map.on('dragstart',()=>follow.checked=false);
map.on('zoomend',restyle);

function toXY(lat,lon){return{x:(lon-origin.lon)*K*R*Math.cos(origin.lat*K),y:(lat-origin.lat)*K*R}}
function toLL(p){return[origin.lat+p.y/R/K,origin.lon+p.x/(R*Math.cos(origin.lat*K)*K)]}
function width(){return parseFloat(w.value)||1.5}
function spacing(){return Math.max(0.2,width()-(parseFloat(ov.value)||0))}
function wpx(m){const mpp=156543.03392*Math.cos(origin.lat*K)/Math.pow(2,map.getZoom());return Math.max(2,m/mpp)}
function restyle(){if(!origin)return;for(const s of segs)s.line.setStyle({weight:wpx(width())})}
w.oninput=()=>{restyle();drawLanes();buildLanes();stats();text()};
ov.oninput=()=>{drawLanes();buildLanes();stats()};

/* ---------- coverage grid ---------- */
function key(i,j){return(i+100000)*200003+(j+100000)}
function isCov(x,y){return covered.has(key(Math.floor(x/CELL),Math.floor(y/CELL)))}
function stamp(a,b){
  const r=width()/2,d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/0.25)),rc=Math.ceil(r/CELL);
  for(let s=0;s<=n;s++){
    const px=a.x+(b.x-a.x)*s/n,py=a.y+(b.y-a.y)*s/n,ci=Math.floor(px/CELL),cj=Math.floor(py/CELL);
    for(let i=-rc;i<=rc;i++)for(let j=-rc;j<=rc;j++){
      const cx=(ci+i+0.5)*CELL,cy=(cj+j+0.5)*CELL;
      if((cx-px)*(cx-px)+(cy-py)*(cy-py)<=r*r)covered.add(key(ci+i,cj+j));
    }
  }
}

/* ---------- boundary ---------- */
function inPoly(x,y){
  let c=false;
  for(let i=0,j=bound.length-1;i<bound.length;j=i++){
    const a=bound[i],b=bound[j];
    if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;
  }
  return c;
}
function setBoundary(poly){
  bound=poly;boundLayer.clearLayers();
  L.polygon(poly.map(p=>toLL(p)),{color:'#00e5ff',weight:3,dashArray:'8 6',fillOpacity:.05,interactive:false}).addTo(boundLayer);
  let a=0,x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<poly.length;i++){
    const p=poly[i],q=poly[(i+1)%poly.length];
    a+=p.x*q.y-q.x*p.y;
    x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);
  }
  boundArea=Math.abs(a)/2;
  const st=Math.max(1,Math.sqrt(boundArea/12000));
  gridPts=[];
  for(let x=x0;x<=x1;x+=st)for(let y=y0;y<=y1;y+=st)if(inPoly(x,y))gridPts.push({x,y});
  buildLanes();stats();
}
function clearBoundary(){
  bound=null;gridPts=[];laneData=null;lastDone=null;boundLayer.clearLayers();stats();
}
function buildLanes(){
  laneData=null;lastDone=null;
  if(!bound||!guide)return;
  const sp=spacing();
  let p0=1e9,p1=-1e9,t0=1e9,t1=-1e9;
  for(const p of bound){
    const ct=(p.x-A.x)*guide.nx+(p.y-A.y)*guide.ny,t=(p.x-A.x)*guide.dx+(p.y-A.y)*guide.dy;
    p0=Math.min(p0,ct);p1=Math.max(p1,ct);t0=Math.min(t0,t);t1=Math.max(t1,t);
  }
  laneData=[];
  for(let n=Math.floor(p0/sp);n<=Math.ceil(p1/sp);n++){
    const pts=[];
    for(let t=Math.floor(t0);t<=t1;t+=0.5){
      const x=A.x+guide.nx*n*sp+guide.dx*t,y=A.y+guide.ny*n*sp+guide.dy*t;
      if(inPoly(x,y))pts.push({x,y});
    }
    if(pts.length>=2)laneData.push({n,pts});
  }
}
function stats(){
  if(!bound){prog.style.display='none';return}
  prog.style.display='block';
  let cov=0;
  for(const p of gridPts)if(isCov(p.x,p.y))cov++;
  const pct=gridPts.length?Math.round(100*cov/gridPts.length):0;
  let s;
  if(laneData){
    let done=0;
    for(const l of laneData){
      let c=0;for(const p of l.pts)if(isCov(p.x,p.y))c++;
      if(c/l.pts.length>=DONE_FRAC)done++;
    }
    const tot=laneData.length,rem=tot-done;
    s='Sweeps left '+rem+' of '+tot+' · '+pct+'%';
    if(lastDone!==null&&done>lastDone&&state==='running')say(rem>0?'Sweep complete. '+rem+' remaining':'Area complete');
    lastDone=done;
  }else s=pct+'% of '+Math.round(boundArea)+' m² · Mark A and B for sweep count';
  if(tick()>60000&&length>5){
    const rate=length*width()/(tick()/1000),mins=boundArea*(1-pct/100)/rate/60;
    if(isFinite(mins)&&pct<100)s+=' · ~'+Math.max(1,Math.round(mins))+' min left';
  }
  prog.textContent=s;
}

/* ---------- drawing the boundary ---------- */
function startDraw(m){
  if(!origin){hint.style.display='block';hint.textContent='Waiting for GPS first';return}
  drawMode=m;drawPts=[];drawLayer.clearLayers();follow.checked=false;
  hint.style.display='block';
  hint.textContent=m==='rect'?'Rectangle: tap corner 1 (1 of 3)':'Circle: tap the centre (1 of 2)';
}
function endDraw(){drawMode=null;drawPts=[];drawLayer.clearLayers();hint.style.display='none'}
function tooSmall(){const m=drawMode;startDraw(m);hint.textContent='Too small. Start again: tap the first point'}
$('brect').onclick=()=>startDraw('rect');
$('bcirc').onclick=()=>startDraw('circ');
$('bclr').onclick=()=>{endDraw();clearBoundary()};
map.on('click',e=>{
  if(!drawMode||!origin)return;
  const p=toXY(e.latlng.lat,e.latlng.lng);
  drawPts.push(p);
  L.circleMarker(e.latlng,{radius:6,color:'#00e5ff',fillColor:'#00e5ff',fillOpacity:1}).addTo(drawLayer);
  const k=drawPts.length;
  if(drawMode==='rect'){
    if(k===1)hint.textContent='Tap corner 2 along the same edge (2 of 3)';
    else if(k===2){
      L.polyline(drawPts.map(q=>toLL(q)),{color:'#00e5ff',weight:2}).addTo(drawLayer);
      hint.textContent='Tap any point on the opposite side (3 of 3)';
    }else{
      const [p1,p2,p3]=drawPts,len=Math.hypot(p2.x-p1.x,p2.y-p1.y);
      if(len<2)return tooSmall();
      const ux=(p2.x-p1.x)/len,uy=(p2.y-p1.y)/len,vx=-uy,vy=ux;
      const h=(p3.x-p1.x)*vx+(p3.y-p1.y)*vy;
      if(Math.abs(h)<2)return tooSmall();
      setBoundary([p1,p2,{x:p2.x+vx*h,y:p2.y+vy*h},{x:p1.x+vx*h,y:p1.y+vy*h}]);
      endDraw();
    }
  }else{
    if(k===1)hint.textContent='Tap a point on the edge (2 of 2)';
    else{
      const c=drawPts[0],r=Math.hypot(p.x-c.x,p.y-c.y);
      if(r<2)return tooSmall();
      const poly=[];
      for(let i=0;i<48;i++){const a=i/48*2*Math.PI;poly.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r})}
      setBoundary(poly);endDraw();
    }
  }
});

/* ---------- run control ---------- */
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator)lock=await navigator.wakeLock.request('screen');
    else if(lock){await lock.release();lock=null}
  }catch(e){}
}
function tick(){return elapsed+(state==='running'?Date.now()-runStart:0)}
function startRun(){
  const line=L.polyline([],{color:'#9be15d',weight:wpx(width()),opacity:.65,lineCap:'butt',lineJoin:'round'}).addTo(swathLayer);
  seg={pts:[],line};segs.push(seg);state='running';runStart=Date.now();keepAwake(true);
  lastSpeak=Date.now();wasOff=false;lastAbs=null;
}
function stopRun(ns){
  if(state==='running')elapsed+=Date.now()-runStart;
  state=ns;seg=null;if(ns==='finished'||ns==='idle')keepAwake(false);
}
go.onclick=()=>{
  if(!cur)return;
  if(state==='running'){stopRun('paused');say('Paused')}
  else{startRun();say('Recording')}
  ui();
};
fin.onclick=()=>{stopRun('finished');say('Finished');ui()};
$('clr').onclick=()=>{
  stopRun('idle');segs=[];swathLayer.clearLayers();length=0;elapsed=0;covered.clear();
  clearGuide();endDraw();clearBoundary();ui();
};
function clearGuide(){
  A=null;guide=null;laneIdx=null;gstage=0;herr=null;laneData=null;lastDone=null;
  lanesLayer.clearLayers();mark.textContent='Mark A';stats();
}
mark.onclick=()=>{
  if(!cur)return;
  if(gstage===0){A={x:cur.x,y:cur.y};gstage=1;mark.textContent='Mark B';say('Point A marked')}
  else if(gstage===1){
    const dx=cur.x-A.x,dy=cur.y-A.y,d=Math.hypot(dx,dy);
    if(d
