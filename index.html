<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font:18px sans-serif;background:#111;color:#fff}
#bar{padding:8px;display:flex;gap:8px;align-items:center}
input{width:70px;font-size:20px}
button{font-size:18px}
canvas{display:block;width:100vw;height:70vh;background:#1b3a1b}
#info{padding:8px;font:16px monospace;white-space:pre}
</style>
<div id="bar">Width (m) <input id="w" type="number" value="1.5" step="0.1"> <button id="clr">Clear</button></div>
<canvas id="c"></canvas>
<div id="info">Waiting for GPS…</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const w=document.getElementById('w'),info=document.getElementById('info');
const PPM=8; // screen pixels per metre
let origin=null,pts=[],cur=null,heading=null;
function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;draw()}
addEventListener('resize',resize);
document.getElementById('clr').onclick=()=>{pts=[];draw()};
function toXY(lat,lon){
  const R=6371000,k=Math.PI/180;
  return {x:(lon-origin.lon)*k*R*Math.cos(origin.lat*k),
          y:(lat-origin.lat)*k*R};
}
function draw(){
  const s=PPM*devicePixelRatio;
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,c.width,c.height);
  if(!cur)return;
  x.translate(c.width/2,c.height/2);
  x.scale(s,-s); // y up = north
  x.translate(-cur.x,-cur.y);
  // grid every 10 m
  x.lineWidth=1/s;x.strokeStyle='rgba(255,255,255,.2)';
  const gx=Math.floor((cur.x-60)/10)*10,gy=Math.floor((cur.y-60)/10)*10;
  for(let i=0;i<=12;i++){
    x.beginPath();x.moveTo(gx+i*10,gy);x.lineTo(gx+i*10,gy+120);x.stroke();
    x.beginPath();x.moveTo(gx,gy+i*10);x.lineTo(gx+120,gy+i*10);x.stroke();
  }
  // mowed swath
  if(pts.length>1){
    x.lineWidth=parseFloat(w.value)||1.5;
    x.lineJoin='round';x.lineCap='butt';
    x.strokeStyle='#9be15d';
    x.beginPath();x.moveTo(pts[0].x,pts[0].y);
    for(const p of pts)x.lineTo(p.x,p.y);
    x.lineTo(cur.x,cur.y);x.stroke();
  }
  // you
  x.fillStyle='#fff';x.beginPath();x.arc(cur.x,cur.y,0.7,0,7);x.fill();
  if(heading!=null){
    const a=heading*Math.PI/180;
    x.strokeStyle='#fff';x.lineWidth=0.3;
    x.beginPath();x.moveTo(cur.x,cur.y);
    x.lineTo(cur.x+Math.sin(a)*4,cur.y+Math.cos(a)*4);x.stroke();
  }
}
navigator.geolocation.watchPosition(p=>{
  const q=p.coords;
  if(!origin)origin={lat:q.latitude,lon:q.longitude};
  cur=toXY(q.latitude,q.longitude);
  if(q.heading!=null&&!isNaN(q.heading))heading=q.heading;
  const last=pts[pts.length-1];
  if(q.accuracy<=20&&(!last||Math.hypot(cur.x-last.x,cur.y-last.y)>=1))pts.push(cur);
  info.textContent=`Accuracy ±${q.accuracy.toFixed(0)} m\nSpeed ${q.speed==null?'–':(q.speed*3.6).toFixed(1)} km/h\nHeading ${heading==null?'–':heading.toFixed(0)}°\nPoints ${pts.length}`;
  draw();
},e=>info.textContent=e.message,{enableHighAccuracy:true,maximumAge:0});
resize();
</script>
