<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
body{margin:0;font:18px sans-serif;background:#111;color:#fff}
.row{padding:6px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=number]{width:60px;font-size:20px}
button{font-size:19px;padding:10px 14px;border:0;border-radius:10px;background:#e5e5ea}
#go{background:#2e9d3f;color:#fff}
#fin{background:#c0392b;color:#fff}
button:disabled{opacity:.4}
#map{width:100vw;height:46vh;background:#1b3a1b}
#steer{padding:8px;font:bold 28px sans-serif;text-align:center;background:#222}
#info{padding:8px;font:15px monospace;white-space:pre}
</style>
<div class="row">Width <input id="w" type="number" value="1.5" step="0.1"> Overlap <input id="ov" type="number" value="0.1" step="0.05"> Tol <input id="tol" type="number" value="0.3" step="0.1"></div>
<div class="row"><button id="go">Start</button><button id="fin" disabled>Finish</button><button id="mark">Mark A</button><button id="clr">New job</button><label><input type="checkbox" id="follow" checked> Follow</label></div>
<div id="map"></div>
<div id="steer">Mark A at the start of your first pass</div>
<div id="info">Waiting for GPS…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const w=$('w'),ov=$('ov'),tol=$('tol'),info=$('info'),steer=$('steer');
const go=$('go'),fin=$('fin'),mark=$('mark'),follow=$('follow');
const R=6371000,K=Math.PI/180,MAX_ACC=10,MIN_SPEED=0.3;
let origin=null,cur=null,heading=null,acc=null,spd=null;
let state='idle',segs=[],seg=null,length=0,runStart=0,elapsed=0,lock=null;
let A=null,guide=null,laneIdx=null,gstage=0,herr=null;

const map=L.map('map',{zoomControl:false,maxZoom:21}).setView([0,0],2);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxNativeZoom:17,maxZoom:21,attribution:'Imagery © Esri'}).addTo(map);
const lanesLayer=L.layerGroup().addTo(map),swathLayer=L.layerGroup().addTo(map);
const me=L.circleMarker([0,0],{radius:8,color:'#000',weight:2,fillColor:'#fff',fillOpacity:1});
const head=L.polyline([],{color:'#fff',weight:3});
map.on('dragstart',()=>follow.checked=false);
map.on('zoomend',restyle);

function toXY(lat,lon){return{x:(lon-origin.lon)*K*R*Math.cos(origin.lat*K),y:(lat-origin.lat)*K*R}}
function toLL(p){return[origin.lat+p.y/R/K,origin.lon+p.x/(R*Math.cos(origin.lat*K)*K)]}
function width(){return parseFloat(w.value)||1.5}
function spacing(){return Math.max(0.2,width()-(parseFloat(ov.value)||0))}
function wpx(m){const mpp=156543.03392*Math.cos(origin.lat*K)/Math.pow(2,map.getZoom());return Math.max(2,m/mpp)}
function restyle(){if(!origin)return;for(const s of segs)s.line.setStyle({weight:wpx(width())})}
w.oninput=()=>{restyle();drawLanes();text()};
ov.oninput=()=>{drawLanes()};

async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator)lock=await navigator.wakeLock.request('screen');
    else if(lock){await lock.release();lock=null}
  }catch(e){}
}
function tick(){return elapsed+(state==='running'?Date.now()-runStart:0)}
function startRun(){
  const line=L.polyline([],{color:'#9be15d',weight:wpx(width()),opacity:.65,lineCap:'butt',lineJoin:'round'}).addTo(swathLayer);
  seg={pts:[],line};segs.push(seg);state='running';runStart=Date.now();keepAwake(true);
}
function stopRun(ns){
  if(state==='running')elapsed+=Date.now()-runStart;
  state=ns;seg=null;if(ns==='finished'||ns==='idle')keepAwake(false);
}
go.onclick=()=>{
  if(!cur)return;
  if(state==='running')stopRun('paused');else startRun();
  ui();
};
fin.onclick=()=>{stopRun('finished');ui()};
$('clr').onclick=()=>{
  stopRun('idle');segs=[];swathLayer.clearLayers();length=0;elapsed=0;
  clearGuide();ui();
};
function clearGuide(){A=null;guide=null;laneIdx=null;gstage=0;herr=null;lanesLayer.clearLayers();mark.textContent='Mark A'}
mark.onclick=()=>{
  if(!cur)return;
  if(gstage===0){A={x:cur.x,y:cur.y};gstage=1;mark.textContent='Mark B'}
  else if(gstage===1){
    const dx=cur.x-A.x,dy=cur.y-A.y,d=Math.hypot(dx,dy);
    if(d<10){steer.textContent='Move 10 m+ from A, then Mark B';return}
    guide={dx:dx/d,dy:dy/d,nx:-dy/d,ny:dx/d};
    gstage=2;laneIdx=null;mark.textContent='Clear guide';
  }else clearGuide();
  guidance();
};
function ui(){
  go.textContent=state==='running'?'Pause':state==='paused'?'Resume':'Start';
  go.disabled=state==='finished';
  fin.disabled=!(state==='running'||state==='paused');
  me.setStyle({fillColor:state==='running'?'#fff':'#f5a623'});
  text();
}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'}
function text(){
  const warn=acc!=null&&acc>MAX_ACC?'  ⚠ GPS weak, not recording':'';
  info.textContent=
`Status ${state.toUpperCase()}
Accuracy ±${acc==null?'–':acc.toFixed(0)} m${warn}
Speed ${spd==null?'–':(spd*3.6).toFixed(1)} km/h  Heading ${heading==null?'–':heading.toFixed(0)}°
Mowed ${(length*width()).toFixed(0)} m²  Time ${fmt(tick())}`+
(guide?`\nLane ${laneIdx} (spacing ${spacing().toFixed(2)} m)  Angle off ${herr==null?'–':herr.toFixed(1)}°`:'');
}
function drawLanes(){
  lanesLayer.clearLayers();
  if(!guide)return;
  const sp=spacing(),c=laneIdx==null?0:laneIdx;
  for(let n=c-5;n<=c+5;n++){
    const ox=A.x+guide.nx*n*sp,oy=A.y+guide.ny*n*sp,on=n===c;
    L.polyline([toLL({x:ox-guide.dx*150,y:oy-guide.dy*150}),toLL({x:ox+guide.dx*150,y:oy+guide.dy*150})],
      {color:on?'#ffd400':'#fff',weight:on?3:1.5,opacity:on?1:.6,dashArray:on?null:'6 6'}).addTo(lanesLayer);
  }
}
function guidance(){
  if(gstage===0){steer.style.color='#fff';steer.textContent='Mark A at the start of your first pass';return}
  if(gstage===1){steer.style.color='#fff';steer.textContent='Drive the first pass, then Mark B';return}
  const sp=spacing();
  const ct=(cur.x-A.x)*guide.nx+(cur.y-A.y)*guide.ny;
  const idx=Math.round(ct/sp),e=ct-idx*sp;
  if(idx!==laneIdx){laneIdx=idx;drawLanes()}
  let sign=1;herr=null;
  if(heading!=null){
    const dot=Math.sin(heading*K)*guide.dx+Math.cos(heading*K)*guide.dy;
    sign=dot>=0?1:-1;herr=Math.acos(Math.min(1,Math.abs(dot)))/K;
  }
  const left=e*sign; // + means you are left of the lane, as you face
  const t=parseFloat(tol.value)||0.3;
  if(Math.abs(left)<=t){steer.style.color='#5be37d';steer.textContent='ON LINE ✓'}
  else{
    steer.style.color='#ffb347';
    steer.textContent=(left>0?'STEER RIGHT ▶ ':'◀ STEER LEFT ')+Math.abs(left).toFixed(1)+' m';
  }
}
navigator.geolocation.watchPosition(p=>{
  const q=p.coords;
  if(!origin){
    origin={lat:q.latitude,lon:q.longitude};
    me.addTo(map);head.addTo(map);map.setView([q.latitude,q.longitude],18);
  }
  cur=toXY(q.latitude,q.longitude);acc=q.accuracy;spd=q.speed;
  if(q.heading!=null&&!isNaN(q.heading))heading=q.heading;
  const ll=[q.latitude,q.longitude];
  me.setLatLng(ll);
  if(heading!=null){const a=heading*K;head.setLatLngs([ll,toLL({x:cur.x+Math.sin(a)*4,y:cur.y+Math.cos(a)*4})])}
  if(follow.checked)map.setView(ll,map.getZoom(),{animate:false});
  if(state==='running'&&acc<=MAX_ACC&&(spd==null||spd>=MIN_SPEED)){
    const last=seg.pts[seg.pts.length-1];
    const d=last?Math.hypot(cur.x-last.x,cur.y-last.y):0;
    if(!last||d>=1){seg.pts.push(cur);seg.line.addLatLng(ll);length+=d}
  }
  guidance();text();
},e=>info.textContent=e.message,{enableHighAccuracy:true,maximumAge:0});
setInterval(text,1000);
ui();
</script>
